version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      go-dependencies:
        patterns:
          - "*"

  # integration/ is a separate Go module (it holds the cinc-server-ng test
  # server, so that dependency never reaches the root module), and Dependabot
  # only updates the directories listed here.
  - package-ecosystem: gomod
    directory: /integration
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      integration-dependencies:
        patterns:
          - "*"

  # Providers for the cinc-server-erlang stack.
  - package-ecosystem: terraform
    directory: /integration/terraform
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      terraform-providers:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
